[project]
name = "market-intelligence-pipeline"
version = "0.1.0"
description = "A Markdown-driven beverage intelligence demonstrator using the GitHub Copilot SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "github-copilot-sdk==1.0.15",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "streamlit>=1.45,<2",
  "typer>=0.16,<1",
]

[project.scripts]
mip = "market_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

[[tool.uv.index]]
name = "microsoft"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/market_intelligence/cli.py" = ["B008"]
